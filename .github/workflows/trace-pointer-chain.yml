name: Trace shared HTTP pointer chain
on:
  workflow_dispatch:
  push:
    paths:
      - 'code_decompressed.bin'
      - 'analysis/trace_pointer_chain.py'
      - '.github/workflows/trace-pointer-chain.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 analysis/trace_pointer_chain.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/shared_http_pointer_chain.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add shared HTTP pointer chain trace'
          git push
