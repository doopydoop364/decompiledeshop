name: Trace network string references

on:
  workflow_dispatch:
  push:
    paths:
      - 'code_decompressed.bin'
      - 'analysis/trace_network_refs.py'
      - '.github/workflows/trace-network-refs.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trace references
        run: python3 analysis/trace_network_refs.py

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/network_refs.txt
          if git diff --cached --quiet; then
            echo 'No report changes.'
          else
            git commit -m 'Add network string reference report'
            git push
          fi
