name: Trace HTTP host/config pointers
on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/trace_http_hosts.py"
      - "code_decompressed.bin"
      - ".github/workflows/trace-http-hosts.yml"
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 analysis/trace_http_hosts.py
      - uses: EndBug/add-and-commit@v9
        with:
          add: "analysis/http_host_trace.txt"
          message: "Add HTTP host/config pointer trace"
