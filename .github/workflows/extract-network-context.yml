name: Extract network code context

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/find_network_code.py'
      - 'eshop_decompile_v3.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract context
        run: python3 analysis/find_network_code.py

      - name: Commit context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/network_code_context.txt
          if git diff --cached --quiet; then
            echo 'No context changes.'
          else
            git commit -m 'Add network code context'
            git push
          fi
